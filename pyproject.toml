[project]
name = "vlacourse"
version = "0.1.0"
description = "Vision-Language-Action models from first principles to multi-robot and UAV research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.8",
    "numpy>=2.0",
    "matplotlib>=3.9",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "transformers>=4.50",
    "tokenizers>=0.21",
    "safetensors>=0.4",
    "huggingface-hub>=0.30",
    "pyyaml>=6.0",
    "mujoco>=3.2",
    "pyarrow>=17",
    "av>=12",
    "pandas>=2.2",
]

[dependency-groups]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "pymdown-extensions>=10.8"]
dev = ["pytest>=8", "nbmake>=1.5", "jupytext>=1.16", "nbclient>=0.10"]

[tool.uv]
default-groups = ["docs", "dev"]

# CUDA 12.8 wheels: required for Blackwell GPUs, and they also run on CPU-only machines.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vlacourse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
